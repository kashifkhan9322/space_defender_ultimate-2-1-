<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Space Defender Ultimate</title>
    <meta name="description" content="Log in to Space Defender Ultimate and defend the galaxy.">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <!-- Background -->
    <div class="starfield"></div>
    <div class="nebula-glow top-right"></div>
    <div class="nebula-glow bottom-left"></div>

    <!-- Page -->
    <div class="page-wrapper login-page" id="loginPage">
        <div class="login-card">
            <span class="game-logo-icon">🚀</span>
            <h1 class="game-logo">Space Defender</h1>
            <p class="game-subtitle">Ultimate Edition</p>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Enter your callsign"
                        autocomplete="username" required>
                    <p class="form-error" id="usernameError">Username is required</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter password"
                        autocomplete="current-password" required>
                    <p class="form-error" id="passwordError">Password is required</p>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    Launch
                </button>
            </form>

            <div class="login-message" id="loginMessage"></div>

            <div class="login-footer">
                <span>New pilot? </span>
                <a href="#" id="registerLink" onclick="handleRegister(event)">Register here</a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>

</html>
